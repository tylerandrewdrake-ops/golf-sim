.neg{color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px;margin-bottom:14px}
.strip{display:grid;grid-template-columns:repeat(18,1fr);gap:2px;margin-bottom:14px}
.strip div{text-align:center;font-size:.72rem;padding:3px 0;border:1px solid var(--line);background:var(--card);border-radius:2px;min-height:34px}
.strip b{display:block;color:var(--mut);font-weight:400}
.strip .cur{border-color:var(--grn);outline:2px solid var(--grn)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;margin:12px 0}
.grid span{display:block;color:var(--mut);font-size:.82rem}
.grid .w{grid-column:1/-1}
.bags{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:8px}.bags .opt{margin-top:0}
ul{margin:6px 0 0;padding-left:20px}

.opt:hover{background:var(--bg)}.opt:focus-visible,input:focus-visible,.go:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.opt b{display:block}.opt small{color:var(--mut);font-size:.9rem}
.cu{display:flex;gap:8px;margin-top:9px}
input{flex:1;min-width:0;font:inherit;padding:10px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--ink)}
.go{background:var(--grn);color:var(--card);border:0;border-radius:4px;padding:10px 18px;font:600 1rem 'Libre Franklin',sans-serif;cursor:pointer}
.res{border-left:5px solid var(--gold)}
.res p{margin:.3em 0}
.sum{font-weight:600;margin-top:8px}
table{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:10px}td,th{border-bottom:1px solid var(--line);padding:5px;text-align:center}
@media(max-width:560px){.strip{grid-template-columns:repeat(9,1fr)}}
@media(prefers-reduced-motion:no-preference){.res{animation:in .4s}@keyframes in{from{opacity:0}to{opacity:1}}}
